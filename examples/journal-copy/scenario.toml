# Task 039: native Copy command, fresh reference and unchanged source/neighbors.
[platform.parameters]
form_object = "Документ.ГотоваяПродукция"
fixture_mode = "journal_existing"
journal_form = "Журнал.Материалы.ФормаСписка.ФормаСписка"
fixture_setup = '''
Спр77 = СоздатьОбъект("Справочник.Номенклатура");
Спр77.Новый();
Спр77.Наименование = "Harness77 продукция 039";
Спр77.Записать();
Объект77Подготовки = СоздатьОбъект("СписокЗначений");
Для Номер77 = 1 По 3 Цикл
    Док77 = СоздатьОбъект("Документ.ГотоваяПродукция");
    Док77.Новый();
    Док77.ДатаДок = '01.08.2026';
    Если Номер77 = 1 Тогда Док77.ДатаДок = '31.07.2026'; КонецЕсли;
    Док77.Комментарий = "Harness77 журнал 039 " + Строка(Номер77);
    Док77.НоваяСтрока();
    Док77.Товар = Спр77.ТекущийЭлемент();
    Док77.Количество = 1;
    Док77.Стоимость = 10;
    Док77.Сумма = 10;
    Док77.НоваяСтрока();
    Док77.Товар = Спр77.ТекущийЭлемент();
    Док77.Количество = 2;
    Док77.Стоимость = 20;
    Док77.Сумма = 40;
    Док77.Записать();
    Если Док77.Провести(1) <> 1 Тогда Возврат "fixture posting failed"; КонецЕсли;
    Объект77Подготовки.ДобавитьЗначение(Док77.ТекущийДокумент());
КонецЦикла;
Счетчик77 = СоздатьОбъект("Документ.ГотоваяПродукция");
Число77 = 0;
Счетчик77.ВыбратьДокументы();
Пока Счетчик77.ПолучитьДокумент() = 1 Цикл Число77 = Число77 + 1; КонецЦикла;
Объект77Подготовки.ДобавитьЗначение(Число77);
Для Номер77 = 1 По 3 Цикл
    Док77 = СоздатьОбъект("Документ.ГотоваяПродукция");
    Док77.НайтиДокумент(Объект77Подготовки.ПолучитьЗначение(Номер77));
    Объект77Подготовки.ДобавитьЗначение(Строка(Док77.ДатаДок) + "|" + СокрЛП(Док77.НомерДок));
КонецЦикла;
Возврат Объект77Подготовки.ПолучитьЗначение(2);
'''
fixture_verify = '''
Счетчик77 = СоздатьОбъект("Документ.ГотоваяПродукция");
Число77 = 0;
Счетчик77.ВыбратьДокументы();
Пока Счетчик77.ПолучитьДокумент() = 1 Цикл Число77 = Число77 + 1; КонецЦикла;
Итог77 = Строка(Число77 - Объект77Подготовки.ПолучитьЗначение(4)) + "|";

Спр77 = СоздатьОбъект("Справочник.Номенклатура");
Если Спр77.НайтиПоНаименованию("Harness77 продукция 039", 0, 1) <> 1 Тогда Возврат "product missing"; КонецЕсли;
Для Номер77 = 1 По ?(Объект77 = Объект77Подготовки.ПолучитьЗначение(2), 3, 4) Цикл
    Док77 = СоздатьОбъект("Документ.ГотоваяПродукция");
    Если Номер77 = 4 Тогда
        Ссылка77 = Объект77;
    Иначе
        Ссылка77 = Объект77Подготовки.ПолучитьЗначение(Номер77);
    КонецЕсли;
    Если Док77.НайтиДокумент(Ссылка77) <> 1 Тогда Возврат "document missing"; КонецЕсли;
    Строки77 = ""; Ссылки77 = 1;
    Док77.ВыбратьСтроки();
    Пока Док77.ПолучитьСтроку() = 1 Цикл
        Если Док77.Товар <> Спр77.ТекущийЭлемент() Тогда Ссылки77 = 0; КонецЕсли;
        Строки77 = Строки77 + Строка(Док77.Количество) + ":" + Строка(Док77.Стоимость) + ":" + Строка(Док77.Сумма) + ";";
    КонецЦикла;
    Опер77 = СоздатьОбъект("Операция");
    Проводки77 = ""; Число77 = 0;
    Если Опер77.НайтиОперацию(Док77.ТекущийДокумент()) = 1 Тогда
        Опер77.ВыбратьПроводки();
        Пока Опер77.ПолучитьПроводку() = 1 Цикл
            Число77 = Число77 + 1;
            Если Опер77.Дебет.Номенклатура <> Спр77.ТекущийЭлемент() Тогда Ссылки77 = 0; КонецЕсли;
            Проводки77 = Проводки77 + СокрЛП(Опер77.Дебет.Счет.Код) + ">" + СокрЛП(Опер77.Кредит.Счет.Код)
                + ":" + Строка(Опер77.Количество) + ":" + Строка(Опер77.Сумма) + ";";
        КонецЦикла;
    КонецЕсли;
    Если Номер77 = 4 Тогда
        Идентичность77 = ?((Док77.ТекущийДокумент() <> Объект77Подготовки.ПолучитьЗначение(2))
            И (Док77.ДатаДок = Дата77Копии) И (Док77.НомерДок = Номер77Копии), 1, 0);
    Иначе
        Идентичность77 = ?((Строка(Док77.ДатаДок) + "|" + СокрЛП(Док77.НомерДок)) = Объект77Подготовки.ПолучитьЗначение(Номер77 + 4), 1, 0);
    КонецЕсли;
    Итог77 = Итог77 + Строка(Док77.Проведен()) + "|" + Строка(Док77.ПометкаУдаления()) + "|" + СокрЛП(Док77.Комментарий) + "|"
        + Строка(Док77.КоличествоСтрок()) + "|" + Строки77 + "|" + Строка(Ссылки77) + "|"
        + Строка(Число77) + "|" + Проводки77 + "|"
        + Строка(Идентичность77) + "#";
КонецЦикла;
Возврат Итог77;
'''
steps = [
    { journal_period = true, start = "2026-07-31", end = "2026-08-01" },
    { find_document = true, limit = 100, open = false },

    { journal_copy = true },
    { check = "Комментарий", text = "Harness77 журнал 039 2" },
    { rows = 2 },
    { value = "Количество", row = 1, text = "1" },
    { value = "Стоимость", row = 1, text = "10" },
    { value = "Сумма", row = 1, text = "10" },
    { value = "Количество", row = 2, text = "2" },
    { value = "Стоимость", row = 2, text = "20" },
    { value = "Сумма", row = 2, text = "40" },
    { total = "Сумма", text = "50" },
    { row = 1 },
    { cell = "Количество", text = "3" },
    { total = "Сумма", text = "70" },
    { input = "Комментарий", text = "Harness77 копия 039" },
    { value = "Комментарий", text = "Harness77 копия 039" },
    { click = "Записать" },
    { created = true },
    { click = "ОК" },
    { dialog = "Провести документ?", button = "Да" },
    { reopen = true },
    { check = "Комментарий", text = "Harness77 копия 039" },
    { rows = 2 },
    { value = "Количество", row = 1, text = "3" },
    { value = "Стоимость", row = 1, text = "10" },
    { value = "Сумма", row = 1, text = "30" },
    { value = "Количество", row = 2, text = "2" },
    { value = "Стоимость", row = 2, text = "20" },
    { value = "Сумма", row = 2, text = "40" },
    { total = "Сумма", text = "70" },
]

[[platform.tests]]
name = "form-open"
command = "open"
expect = "passed"
expect_value = "1"

[[platform.tests]]
name = "scenario"
command = "result"
expect = "passed"

[[platform.tests]]
name = "persisted-document-and-entries"
command = "verify"
expect = "passed"
expect_value = "DISCOVERY"
