# Пример 025: сценарий на неизменённой форме элемента справочника «Банки».
# prepare.py дописывает к этому тексту машинную часть профиля: [project], [build],
# [configuration] с пустым каталогом (конфигурация не меняется) и [deadlines].

[platform.parameters]
form_object = "Справочник.Банки.ФормаЭлемента"

# Один раз в свежей копии базы: записать банк и вернуть ссылку. Форма откроет эту запись.
fixture_setup = '''
Спр77 = СоздатьОбъект("Справочник.Банки");
Спр77.Новый();
Спр77.УстановитьНовыйКод("77");
Спр77.Наименование = "Harness77 банк 025";
Спр77.Записать();
Возврат Спр77.ТекущийЭлемент();
'''

# После закрытия формы: прочитать запись заново новым объектом выборки.
fixture_verify = '''
Спр77 = СоздатьОбъект("Справочник.Банки");
Если Спр77.НайтиЭлемент(Объект77) <> 1 Тогда
    Возврат "not found";
КонецЕсли;
Возврат СокрЛП(Спр77.Наименование) + "|" + СокрЛП(Спр77.Код);
'''

# Шаги по порядку. Элемент называется идентификатором или подписью формы.
steps = [
    { check = "Наименование", text = "Harness77 банк 025" },
    { input = "Код", text = "12345" },
    { click = "Записать" },
    { message = "Возможно, БИК указан неверно." },
    { input = "Код", text = "047777777" },
    { input = "Наименование", text = "Harness77 изменено 025" },
    { click = "ОК", closes = true },
    { no_message = "Возможно, БИК указан неверно." },
]

[[platform.tests]]
name = "form-open"
command = "open"
expect = "passed"
expect_value = "1"

[[platform.tests]]
name = "scenario"
command = "result"
expect = "passed"

[[platform.tests]]
name = "data-verify"
command = "verify"
expect = "passed"
expect_value = "Harness77 изменено 025|047777777"
