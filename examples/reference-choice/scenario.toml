# Пример 028: выбор товара через F4 в неизменённой форме «Готовая продукция».
[platform.parameters]
form_object = "Документ.ГотоваяПродукция"
fixture_setup = '''
Спр77 = СоздатьОбъект("Справочник.Номенклатура");
Спр77.Новый();
Спр77.Наименование = "Harness77 исходный 028";
Спр77.Записать();
Старый77 = Спр77.ТекущийЭлемент();
Спр77.Новый();
Спр77.Наименование = "Harness77 выбор 028";
Спр77.Записать();
Док77 = СоздатьОбъект("Документ.ГотоваяПродукция");
Док77.Новый();
Док77.НоваяСтрока();
Док77.Товар = Старый77;
Док77.Количество = 1;
Док77.Стоимость = 10;
Док77.Сумма = 10;
Док77.Записать();
Возврат Док77.ТекущийДокумент();
'''
fixture_verify = '''
Док77 = СоздатьОбъект("Документ.ГотоваяПродукция");
Если Док77.НайтиДокумент(Объект77) <> 1 Тогда Возврат "not found"; КонецЕсли;
Док77.ВыбратьСтроки();
Если Док77.ПолучитьСтроку() <> 1 Тогда Возврат "no row"; КонецЕсли;
Спр77 = СоздатьОбъект("Справочник.Номенклатура");
Если Спр77.НайтиПоНаименованию("Harness77 выбор 028", 0, 1) <> 1 Тогда Возврат "no product"; КонецЕсли;
Если Док77.Товар <> Спр77.ТекущийЭлемент() Тогда Возврат "wrong reference"; КонецЕсли;
Возврат "1|" + СокрЛП(Строка(Док77.Товар)) + "|" + Строка(Док77.Количество) + "|" + Строка(Док77.Сумма);
'''
steps = [
    { choose = "Товар", cancel = true },
    { value = "Товар", text = "Harness77 исходный 028" },
    { choose = "Товар", text = "Harness77 выбор 028" },
    { value = "Товар", text = "Harness77 выбор 028" },
    { value = "Стоимость", text = "0" },
    { value = "Сумма", text = "0" },
    { cell = "Стоимость", text = "10" },
    { cell = "Количество", text = "3" },
    { value = "Сумма", text = "30" },
    { click = "Записать" },
    { click = "Закрыть", closes = true },
]

[[platform.tests]]
name = "form-open"
command = "open"
expect = "passed"
expect_value = "1"

[[platform.tests]]
name = "scenario"
command = "result"
expect = "passed"

[[platform.tests]]
name = "data-verify"
command = "verify"
expect = "passed"
expect_value = "1|Harness77 выбор 028|3|30"
