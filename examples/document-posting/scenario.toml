# Task 030: persisted accounting entries, on a new run's copy only.
[platform.parameters]
form_object = "Документ.ГотоваяПродукция"
fixture_post = true
fixture_setup = '''
Спр77 = СоздатьОбъект("Справочник.Номенклатура");
Спр77.Новый();
Спр77.Наименование = "Harness77 продукция 030";
Спр77.Записать();
Док77 = СоздатьОбъект("Документ.ГотоваяПродукция");
Док77.Новый();
Док77.НоваяСтрока();
Док77.Товар = Спр77.ТекущийЭлемент();
Док77.Количество = 1;
Док77.Стоимость = 10;
Док77.Сумма = 10;
Док77.НоваяСтрока();
Док77.Товар = Спр77.ТекущийЭлемент();
Док77.Количество = 2;
Док77.Стоимость = 20;
Док77.Сумма = 40;
Док77.Записать();
Возврат Док77.ТекущийДокумент();
'''
fixture_verify = '''
Док77 = СоздатьОбъект("Документ.ГотоваяПродукция");
Если Док77.НайтиДокумент(Объект77) <> 1 Тогда Возврат "document not found"; КонецЕсли;
Спр77 = СоздатьОбъект("Справочник.Номенклатура");
Если Спр77.НайтиПоНаименованию("Harness77 продукция 030", 0, 1) <> 1 Тогда
    Возврат "product not found";
КонецЕсли;
Опер77 = СоздатьОбъект("Операция");
Число77 = 0; Ссылки77 = 1; Проводки77 = "";
Если Опер77.НайтиОперацию(Объект77) = 1 Тогда
    Опер77.ВыбратьПроводки();
    Пока Опер77.ПолучитьПроводку() = 1 Цикл
        Число77 = Число77 + 1;
        Если Опер77.Дебет.Номенклатура <> Спр77.ТекущийЭлемент() Тогда Ссылки77 = 0; КонецЕсли;
        Проводки77 = Проводки77 + СокрЛП(Опер77.Дебет.Счет.Код) + ">"
            + СокрЛП(Опер77.Кредит.Счет.Код) + ":" + Строка(Опер77.Количество)
            + ":" + Строка(Опер77.Сумма) + ";";
    КонецЦикла;
ИначеЕсли Док77.Проведен() = 1 Тогда
    Возврат "posted document has no operation";
КонецЕсли;
Возврат Строка(Док77.Проведен()) + "|" + Строка(Число77) + "|" + Строка(Ссылки77) + "|" + Проводки77;
'''
steps = [
    { row = 1 },
    { cell = "Количество", text = "3" },
    { value = "Сумма", row = 1, text = "30" },
    { rows = 2 },
    { click = "Записать" },
    { click = "Закрыть", closes = true },
]

[[platform.tests]]
name = "form-open"
command = "open"
expect = "passed"
expect_value = "1"

[[platform.tests]]
name = "scenario"
command = "result"
expect = "passed"

[[platform.tests]]
name = "document-post"
command = "post"
expect = "passed"
expect_value = "1|1"

[[platform.tests]]
name = "persisted-entries"
command = "verify"
expect = "passed"
expect_value = "1|2|1|43>40:3:30;43>40:2:40;"
