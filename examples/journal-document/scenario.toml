# Task 034: create from the unchanged journal, fill/save/post through UI.
[platform.parameters]
form_object = "Документ.ГотоваяПродукция"
fixture_mode = "journal"
journal_form = "Журнал.Материалы.ФормаСписка.ФормаСписка"
fixture_setup = '''
Спр77 = СоздатьОбъект("Справочник.Номенклатура");
Спр77.Новый();
Спр77.Наименование = "Harness77 продукция 034";
Спр77.Записать();
Док77 = СоздатьОбъект("Документ.ГотоваяПродукция");
Число77 = 0;
Док77.ВыбратьДокументы();
Пока Док77.ПолучитьДокумент() = 1 Цикл Число77 = Число77 + 1; КонецЦикла;
Возврат Число77;
'''
fixture_verify = '''
Счетчик77 = СоздатьОбъект("Документ.ГотоваяПродукция");
Число77 = 0;
Счетчик77.ВыбратьДокументы();
Пока Счетчик77.ПолучитьДокумент() = 1 Цикл Число77 = Число77 + 1; КонецЦикла;
Разница77 = Строка(Число77 - Объект77Подготовки);
Если ТипЗначенияСтр(Объект77) <> "Документ" Тогда Возврат Разница77 + "|none"; КонецЕсли;
Док77 = СоздатьОбъект("Документ.ГотоваяПродукция");
Если Док77.НайтиДокумент(Объект77) <> 1 Тогда Возврат "document not found"; КонецЕсли;
Спр77 = СоздатьОбъект("Справочник.Номенклатура");
Если Спр77.НайтиПоНаименованию("Harness77 продукция 034", 0, 1) <> 1 Тогда
    Возврат "product not found";
КонецЕсли;
Строки77 = ""; Ссылки77 = 1;
Док77.ВыбратьСтроки();
Пока Док77.ПолучитьСтроку() = 1 Цикл
    Если Док77.Товар <> Спр77.ТекущийЭлемент() Тогда Ссылки77 = 0; КонецЕсли;
    Строки77 = Строки77 + Строка(Док77.Количество) + ":" + Строка(Док77.Стоимость)
        + ":" + Строка(Док77.Сумма) + ";";
КонецЦикла;
Опер77 = СоздатьОбъект("Операция");
Число77 = 0; Проводки77 = "";
Если Опер77.НайтиОперацию(Объект77) = 1 Тогда
    Опер77.ВыбратьПроводки();
    Пока Опер77.ПолучитьПроводку() = 1 Цикл
        Число77 = Число77 + 1;
        Если Опер77.Дебет.Номенклатура <> Спр77.ТекущийЭлемент() Тогда Ссылки77 = 0; КонецЕсли;
        Проводки77 = Проводки77 + СокрЛП(Опер77.Дебет.Счет.Код) + ">"
            + СокрЛП(Опер77.Кредит.Счет.Код) + ":" + Строка(Опер77.Количество)
            + ":" + Строка(Опер77.Сумма) + ";";
    КонецЦикла;
КонецЕсли;
Возврат Разница77 + "|" + Строка(Док77.Проведен()) + "|" + СокрЛП(Док77.Комментарий) + "|"
    + Строка(Док77.КоличествоСтрок()) + "|" + Строки77 + "|"
    + Строка(Ссылки77) + "|" + Строка(Число77) + "|" + Проводки77;
'''
steps = [
    { create = "Гот.прод. (Передача готовой продукции на склад)" },
    { add_row = true },
    { choose = "Товар", text = "Harness77 продукция 034" },
    { cell = "Количество", text = "3" },
    { cell = "Стоимость", text = "10" },
    { value = "Сумма", row = 1, text = "30" },
    { add_row = true },
    { choose = "Товар", text = "Harness77 продукция 034" },
    { cell = "Количество", text = "2" },
    { cell = "Стоимость", text = "20" },
    { value = "Сумма", row = 2, text = "40" },
    { rows = 2 },
    { total = "Сумма", text = "70" },
    { input = "Комментарий", text = "Harness77 журнал 034" },
    { click = "Записать" },
    { created = true },
    { click = "ОК" },
    { dialog = "Провести документ?", button = "Да", closes = true },
    { reopen = true },
    { check = "Комментарий", text = "Harness77 журнал 034" },
    { value = "Комментарий", text = "Harness77 журнал 034" },
    { rows = 2 },
    { value = "Количество", row = 1, text = "3" },
    { value = "Стоимость", row = 1, text = "10" },
    { value = "Сумма", row = 1, text = "30" },
    { value = "Количество", row = 2, text = "2" },
    { value = "Стоимость", row = 2, text = "20" },
    { value = "Сумма", row = 2, text = "40" },
    { total = "Сумма", text = "70" },
]

[[platform.tests]]
name = "form-open"
command = "open"
expect = "passed"
expect_value = "1"

[[platform.tests]]
name = "scenario"
command = "result"
expect = "passed"

[[platform.tests]]
name = "persisted-document-and-entries"
command = "verify"
expect = "passed"
expect_value = "1|1|Harness77 журнал 034|2|3:10:30;2:20:40;|1|2|43>40:3:30;43>40:2:40;"
