# Task 033: unchanged document form, UI save/post, reopen the same reference.
[platform.parameters]
form_object = "Документ.ГотоваяПродукция"
fixture_setup = '''
Спр77 = СоздатьОбъект("Справочник.Номенклатура");
Спр77.Новый();
Спр77.Наименование = "Harness77 продукция 033";
Спр77.Записать();
Док77 = СоздатьОбъект("Документ.ГотоваяПродукция");
Док77.Новый();
Док77.НоваяСтрока();
Док77.Товар = Спр77.ТекущийЭлемент();
Док77.Количество = 1;
Док77.Стоимость = 10;
Док77.Сумма = 10;
Док77.НоваяСтрока();
Док77.Товар = Спр77.ТекущийЭлемент();
Док77.Количество = 2;
Док77.Стоимость = 20;
Док77.Сумма = 40;
Док77.Записать();
Возврат Док77.ТекущийДокумент();
'''
fixture_verify = '''
Док77 = СоздатьОбъект("Документ.ГотоваяПродукция");
Если Док77.НайтиДокумент(Объект77) <> 1 Тогда Возврат "document not found"; КонецЕсли;
Спр77 = СоздатьОбъект("Справочник.Номенклатура");
Если Спр77.НайтиПоНаименованию("Harness77 продукция 033", 0, 1) <> 1 Тогда
    Возврат "product not found";
КонецЕсли;
Строки77 = ""; Ссылки77 = 1;
Док77.ВыбратьСтроки();
Пока Док77.ПолучитьСтроку() = 1 Цикл
    Если Док77.Товар <> Спр77.ТекущийЭлемент() Тогда Ссылки77 = 0; КонецЕсли;
    Строки77 = Строки77 + Строка(Док77.Количество) + ":" + Строка(Док77.Стоимость)
        + ":" + Строка(Док77.Сумма) + ";";
КонецЦикла;
Опер77 = СоздатьОбъект("Операция");
Число77 = 0; Проводки77 = "";
Если Опер77.НайтиОперацию(Объект77) = 1 Тогда
    Опер77.ВыбратьПроводки();
    Пока Опер77.ПолучитьПроводку() = 1 Цикл
        Число77 = Число77 + 1;
        Если Опер77.Дебет.Номенклатура <> Спр77.ТекущийЭлемент() Тогда Ссылки77 = 0; КонецЕсли;
        Проводки77 = Проводки77 + СокрЛП(Опер77.Дебет.Счет.Код) + ">"
            + СокрЛП(Опер77.Кредит.Счет.Код) + ":" + Строка(Опер77.Количество)
            + ":" + Строка(Опер77.Сумма) + ";";
    КонецЦикла;
КонецЕсли;
Возврат Строка(Док77.Проведен()) + "|" + СокрЛП(Док77.Комментарий) + "|"
    + Строка(Док77.КоличествоСтрок()) + "|" + Строки77 + "|"
    + Строка(Ссылки77) + "|" + Строка(Число77) + "|" + Проводки77;
'''
steps = [
    { row = 1 },
    { cell = "Количество", text = "3" },
    { value = "Сумма", row = 1, text = "30" },
    { rows = 2 },
    { total = "Сумма", text = "70" },
    { input = "Комментарий", text = "Harness77 форма 033" },
    { value = "Комментарий", text = "Harness77 форма 033" },
    { click = "Записать" },
    { click = "ОК" },
    { dialog = "Провести документ?", button = "Да" },
    { reopen = true },
    { check = "Комментарий", text = "Harness77 форма 033" },
    { value = "Комментарий", text = "Harness77 форма 033" },
    { rows = 2 },
    { value = "Количество", row = 1, text = "3" },
    { value = "Стоимость", row = 1, text = "10" },
    { value = "Сумма", row = 1, text = "30" },
    { value = "Количество", row = 2, text = "2" },
    { value = "Стоимость", row = 2, text = "20" },
    { value = "Сумма", row = 2, text = "40" },
    { total = "Сумма", text = "70" },
]

[[platform.tests]]
name = "form-open"
command = "open"
expect = "passed"
expect_value = "1"

[[platform.tests]]
name = "scenario"
command = "result"
expect = "passed"

[[platform.tests]]
name = "persisted-document-and-entries"
command = "verify"
expect = "passed"
expect_value = "1|Harness77 форма 033|2|3:10:30;2:20:40;|1|2|43>40:3:30;43>40:2:40;"
