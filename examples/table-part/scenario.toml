# Пример 027: табличная часть неизменённой формы документа «Готовая продукция».
# prepare.py дописывает к этому тексту машинную часть профиля: [project], [build],
# [configuration] с пустым каталогом (конфигурация не меняется) и [deadlines].

[platform.parameters]
form_object = "Документ.ГотоваяПродукция"

# Один раз в свежей копии базы: товар и документ с одной строкой (количество 1, стоимость 10,
# сумма 10). Форма откроет этот документ.
fixture_setup = '''
Спр77 = СоздатьОбъект("Справочник.Номенклатура");
Спр77.Новый();
Спр77.Наименование = "Harness77 продукция 027";
Спр77.Записать();
Док77 = СоздатьОбъект("Документ.ГотоваяПродукция");
Док77.Новый();
Док77.НоваяСтрока();
Док77.Товар = Спр77.ТекущийЭлемент();
Док77.Количество = 1;
Док77.Стоимость = 10;
Док77.Сумма = 10;
Док77.Записать();
Возврат Док77.ТекущийДокумент();
'''

# После закрытия формы: прочитать документ заново и вернуть число строк, количество и сумму.
fixture_verify = '''
Док77 = СоздатьОбъект("Документ.ГотоваяПродукция");
Если Док77.НайтиДокумент(Объект77) <> 1 Тогда
    Возврат "not found";
КонецЕсли;
Док77.ВыбратьСтроки();
Если Док77.ПолучитьСтроку() <> 1 Тогда
    Возврат "no row";
КонецЕсли;
Возврат Строка(Док77.КоличествоСтрок()) + "|" + Строка(Док77.Количество) + "|" + Строка(Док77.Сумма);
'''

# Курсор на первую строку, ввод количества в ячейку. Формула колонки (Пересчет() модуля формы)
# пересчитывает сумму: 3 × 10. «Записать» записывает документ, «Закрыть» закрывает форму.
steps = [
    { row = 1 },
    { value = "Количество", text = "1" },
    { cell = "Количество", text = "3" },
    { value = "Сумма", text = "30" },
    { total = "Сумма", text = "30" },
    { rows = 1 },
    { click = "Записать" },
    { click = "Закрыть", closes = true },
]

[[platform.tests]]
name = "form-open"
command = "open"
expect = "passed"
expect_value = "1"

[[platform.tests]]
name = "scenario"
command = "result"
expect = "passed"

[[platform.tests]]
name = "data-verify"
command = "verify"
expect = "passed"
expect_value = "1|3|30"
