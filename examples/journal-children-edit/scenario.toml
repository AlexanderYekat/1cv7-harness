    Если Док77.НайтиДокумент(Объект77Подготовки.ПолучитьЗначение(22 + Номер77)) <> 1 Тогда Возврат "invoice missing"; КонецЕсли;
    Поля77 = ?((Док77.Контрагент = Объект77Подготовки.ПолучитьЗначение(9))
        И (Док77.Договор = Объект77Подготовки.ПолучитьЗначение(10))
        И (Док77.Подразделение2 = Объект77Подготовки.ПолучитьЗначение(12))
        И (Док77.ДокументОснование = Объект77Подготовки.ПолучитьЗначение(2))
        И (Док77.ВерсияОбъекта = Константа.НомерРелиза), 1, 0);
    Строки77 = "";
    Док77.ВыбратьСтроки();
    Пока Док77.ПолучитьСтроку() = 1 Цикл
        Если Док77.Товар <> Объект77Подготовки.ПолучитьЗначение(13) Тогда Поля77 = 0; КонецЕсли;
        Строки77 = Строки77 + Строка(Док77.Количество) + ":" + Строка(Док77.Цена) + ":"
            + Строка(Док77.Сумма) + ":" + Строка(Док77.Всего) + ":" + Строка(Док77.НДС) + ":" + Строка(Док77.НП) + ";";
    КонецЦикла;
    Идентичность77 = ?((Строка(Док77.ДатаДок) + "|" + СокрЛП(Док77.НомерДок)) = Объект77Подготовки.ПолучитьЗначение(24 + Номер77), 1, 0);
    Опер77 = СоздатьОбъект("Операция"); Число77 = 0;
    Если Опер77.НайтиОперацию(Док77.ТекущийДокумент()) = 1 Тогда
        Опер77.ВыбратьПроводки();
        Пока Опер77.ПолучитьПроводку() = 1 Цикл Число77 = Число77 + 1; КонецЦикла;
    КонецЕсли;
    Итог77 = Итог77 + "sf:" + Строка(Док77.Проведен()) + "|" + Строка(Док77.ПометкаУдаления()) + "|"
        + СокрЛП(Док77.Комментарий) + "|" + Строка(Док77.КоличествоСтрок()) + "|" + Строки77 + "|"
        + Строка(Поля77) + "|" + Строка(Идентичность77) + "|" + Строка(Число77) + "#";
КонецЦикла;
Возврат Итог77;
'''
