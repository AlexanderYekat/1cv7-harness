# Portable checks of harness77 (task 016): no 1C 7.7, bases or local data.
# The native acceptance runs on the owner's stand, never on a runner.
name: CI

on:
  push:
    # A Dependabot branch is checked once, by its pull request.
    branches-ignore: ["dependabot/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: windows / Python ${{ matrix.python }}
    runs-on: windows-2025
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Declared minimum, the owner's version, the newest release.
        python: ["3.11", "3.13", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install (docs/development.md)
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install --no-build-isolation -e .
      - name: Product tests
        run: python -B -m unittest discover -s tests -v 2>&1 | tee product-tests.log
      - name: Research tests
        if: ${{ !cancelled() }}
        run: |
          status=0
          for suite in platform77 forms kudir; do
            python -B -m unittest discover -s research/$suite/tests -p "test_*.py" -v 2>&1 \
              | tee research-$suite.log || status=1
          done
          exit $status
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          python -B scripts/ci_summary77.py product-tests.log research-platform77.log \
            research-forms.log research-kudir.log >> "$GITHUB_STEP_SUMMARY"

  package:
    name: package / Python 3.13
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build dependency
        run: python -m pip install -r requirements-build.txt
      - name: Verify sdist, wheel and installed package
        run: python scripts/verify_package77.py --output "$RUNNER_TEMP/package77"
      - name: Evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package77
          path: |
            ${{ runner.temp }}/package77/summary.json
            ${{ runner.temp }}/package77/*.log
            ${{ runner.temp }}/package77/dist/
          if-no-files-found: warn
          retention-days: 14

  linux:
    name: linux / Python 3.13
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install (docs/development.md)
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install --no-build-isolation -e .
      - name: Product tests
        run: python -B -m unittest discover -s tests -v 2>&1 | tee product-tests.log
      - name: Summary
        if: ${{ !cancelled() }}
        run: python -B scripts/ci_summary77.py product-tests.log >> "$GITHUB_STEP_SUMMARY"

  # The single required check of master: green only when every job above passed.
  # always(): a cancelled or skipped job must fail it, not leave it skipped.
  ci:
    name: ci
    if: ${{ always() }}
    needs: [windows, package, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do test "$result" = success; done
