[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harness77"
version = "0.1.0"
description = "Reproducible source checks and ERT tooling for 1C 7.7"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
harness77 = "harness77.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harness77 = ["lint77-builtins.json", "lint77-globals.json", "catalog77.json"]
